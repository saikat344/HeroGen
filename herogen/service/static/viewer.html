<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HeroGen viewer</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/assets/fonts/Figtree-Variable.latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/Fraunces-Variable.latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/tokens.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/styles/pages.css">
<script src="/assets/site-header.js" defer></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  },
  "integrity": {
    "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js": "sha384-61S/Nu32S3E5+n+KpCOTb2eRYps6fVKm+9Gz1QBvSePFthb46f063Aa/qe/lykFZ",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js": "sha384-ZGqh+dJjt6z9NHsWYYt+TPDFj8y+2If7naI6a6AkkyNZyH51CVS3HTWFh0njp4k6",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js": "sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js": "sha384-oxY9vSeh7Mrt5WmhN8xfWoDRnmoW9krEiRBY7vJKaK90jMUidM0fhbUwcblpBgTu",
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js": "sha384-jHGXS4+FuVOBnZkNme2ury3Ccg5DWDLYK22xX/WGdZCZsjRM4J+3n6Qc4CXx1Hjf"
  }
}
</script>
<script type="module" src="/assets/viewer.js"></script>
</head>
<body class="viewer-body">
<a class="skip-link" href="#main">Skip to main content</a>
<div class="page-brand"><a class="brand" href="/" aria-label="HeroGen home"><span class="brand__mark" aria-hidden="true">HG</span><span>HeroGen</span></a></div>
<main id="main" tabindex="-1">
  <div class="viewer-run"><label class="eyebrow" for="run">Run</label><select id="run"></select></div>
  <p id="msg" class="muted">Loading…</p>
  <section class="card"><canvas id="preview" class="big" aria-label="3D view of the body"></canvas></section>
  <section class="card"><h2>Stages</h2><table class="checks"><thead><tr><th>Stage</th><th>Status</th><th>Time</th><th>Cost (estimate)</th></tr></thead><tbody id="stages"></tbody></table></section>
  <section class="card"><h2>Images</h2><div id="images" class="images"></div></section>
</main>
<div class="app-bar" id="appBar">
  <div class="app-bar__start"></div>
  <nav class="nav" id="siteNav" aria-label="Main">
    <a class="nav__link" href="/"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-sparkles"></use></svg><span class="nav__label">Create</span></a>
    <a class="nav__link" href="/#heroes"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-person-standing"></use></svg><span class="nav__label"><span class="nav__long">Your heroes</span><span class="nav__short" aria-hidden="true">Heroes</span></span></a>
    <a class="nav__link" href="/#gallery"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-layers"></use></svg><span class="nav__label">Gallery</span></a>
    <a class="nav__link" href="https://github.com/saikat344/HeroGen" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-git-fork"></use></svg><span class="nav__label"><span class="nav__long">Open source</span><span class="nav__short" aria-hidden="true">Source</span></span><svg class="icon icon--s nav__ext" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-external-link"></use></svg><span class="sr"> (opens in a new tab)</span></a>
  </nav>
  <div class="app-bar__end"><button type="button" class="btn btn--ghost btn--icon theme-toggle" data-theme-toggle aria-label="Theme"><svg class="icon" aria-hidden="true"><use href="/assets/icons/sprite.svg#i-moon"></use></svg></button></div>
</div>
</body>
</html>
