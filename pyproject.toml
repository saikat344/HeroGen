[project]
name = "herogen"
version = "0.1.0"
description = "One hand-drawn character sketch to a measured, game-ready Roblox hero body."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["numpy", "pillow"]

[project.optional-dependencies]
live = ["meta-sam-parser"]
# SAM 3D Objects and SAM 3D Body on Modal (stage 3 --mesh-source sam3d-objects / --joints sam3d-body).
remote = ["modal"]

[tool.setuptools.packages.find]
include = ["herogen*"]

[tool.setuptools.package-data]
"herogen.roblox" = ["templates/*.luau", "templates/*.txt"]

[tool.ruff]
line-length = 110
