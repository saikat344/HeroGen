name: release

# A tag vX.Y.Z-rc.N deploys the hosted service to staging; a tag vX.Y.Z deploys it to production, only when the
# same commit carries a vX.Y.Z-rc.N tag. The rules are tools/release/release.py; docs/ARCHITECTURE.md ("Releases")
# describes the flow and the settings each GitHub environment needs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every tag, to find the rc tags on a production tag's commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag
        id: plan
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release/release.py plan "$TAG"

  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.environment }}
    # One deploy per environment at a time; a running deploy is never cancelled.
    concurrency:
      group: release-deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the service and the deploy settings
        env:
          TAG: ${{ github.ref_name }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HEROGEN_SERVICE_APP: ${{ vars.HEROGEN_SERVICE_APP }}
          HEROGEN_SERVICE_BASE_URL: ${{ vars.HEROGEN_SERVICE_BASE_URL }}
          HEROGEN_SERVICE_EMAIL_FROM: ${{ vars.HEROGEN_SERVICE_EMAIL_FROM }}
          HEROGEN_SERVICE_TERMS_VERSION: ${{ vars.HEROGEN_SERVICE_TERMS_VERSION }}
        run: python3 tools/release/release.py check "$TAG"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/release/requirements.txt
      - name: Install the Modal CLI
        run: pip install -r tools/release/requirements.txt
      - name: Deploy
        env:
          TAG: ${{ github.ref_name }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HEROGEN_SERVICE_APP: ${{ vars.HEROGEN_SERVICE_APP }}
          HEROGEN_SERVICE_BASE_URL: ${{ vars.HEROGEN_SERVICE_BASE_URL }}
          HEROGEN_SERVICE_EMAIL_FROM: ${{ vars.HEROGEN_SERVICE_EMAIL_FROM }}
          HEROGEN_SERVICE_TERMS_VERSION: ${{ vars.HEROGEN_SERVICE_TERMS_VERSION }}
        run: python3 tools/release/release.py deploy "$TAG"
